#:schema node_modules/wrangler/config-schema.json
name = "bytes"
main = "worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
FRONTEND_URL = "https://bytes.wariots40.workers.dev"
REQUIRE_AUTH = "false"
# Add your environment variables or secrets using `wrangler secret put <KEY>`:
# META_API_KEY_1 = "..."
# META_API_KEY_2 = "..."
# ...
# META_API_KEY_10 = "..."
