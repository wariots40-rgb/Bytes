#:schema node_modules/wrangler/config-schema.json
name = "bytes"
main = "worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"

[vars]
FRONTEND_URL = "https://bytes.wariots40.workers.dev"
REQUIRE_AUTH = "false"
SUPABASE_URL = "https://twslcchmbakezfynbafc.supabase.co"
# Clerk & Supabase Database Configuration
# Public key can also be placed in [vars]:
# CLERK_PUBLISHABLE_KEY = "pk_test_..."
# Secrets to add via `wrangler secret put <KEY>`:
# SUPABASE_SERVICE_ROLE_KEY = "..."
# CLERK_SECRET_KEY = "..."
# META_API_KEY_1 through META_API_KEY_10
